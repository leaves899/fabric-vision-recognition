name: Publish existing frozen FabricNET horizontal ablation artifacts
on:
  push:
    branches: [experiment/fabricnet-horizontal-ablation-20261021]
    paths: [.github/workflows/fabricnet-horizontal-ablation-recover.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover-five-completed-runs-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install summary dependencies
        run: |
          python -m pip install -r shibie/requirements.txt
          python -m pip install pandas
          python -m py_compile shibie/summarize_fabricnet_horizontal_ablation_20261021.py
      - name: Download five already-completed 130-photo frozen artifacts (NO new inference)
        uses: actions/download-artifact@v4
        with:
          pattern: fabricnet-ablate-*
          run-id: 39558548624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: leaves899/fabric-vision-recognition
          path: /tmp/fabricnet-ablation-runs
          merge-multiple: false
      - name: Validate frozen inputs, compare arms with CI, publish 20 image panels
        shell: bash
        run: |
          set -euo pipefail
          output=experiments/fabricnet-horizontal-ablation/analysis
          mkdir -p "$output"
          python -u shibie/summarize_fabricnet_horizontal_ablation_20261021.py \
            --inputs /tmp/fabricnet-ablation-runs --out "$output" \
            --baseline experiments/fabricnet-latest-130-validation/visual_samples/V063_all130_metrics.csv \
            --previous-h2 experiments/fabricnet-horizontal-twice/measurements/horizontal_twice_metrics.csv \
            2>&1 | tee "$output/analysis.log"
          test -s "$output/summary.json"
          test -s "$output/REPORT.md"
          test "$(find "$output/visual_4arm" -type f -name '*_4arm.jpg' | wc -l)" -eq 20
          dir=experiments/fabricnet-horizontal-ablation/arm_metrics
          mkdir -p "$dir"
          for arm in DIRECT_FIXED ROT90_FIXED DIRECT_ESTIMATED ROT90_ESTIMATED ROT270_FIXED; do
            src="/tmp/fabricnet-ablation-runs/fabricnet-ablate-$arm"
            test -s "$src/metrics.csv"
            test -s "$src/summary.json"
            cp "$src/metrics.csv" "$dir/$arm.csv"
            cp "$src/summary.json" "$dir/$arm.json"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$output" "$dir"
          git commit -m 'test(fabricnet): publish five-arm paired ablation result, CIs and exact 20-photo visual evidence'
          git push origin HEAD:refs/heads/experiment/fabricnet-horizontal-ablation-20261021
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabricnet-horizontal-ablation-verified-results
          path: experiments/fabricnet-horizontal-ablation/analysis
          retention-days: 30
          if-no-files-found: warn
