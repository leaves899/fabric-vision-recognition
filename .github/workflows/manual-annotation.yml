name: V5 manual yarn reference annotation
on:
  pull_request:
  push:
    branches: [main]

jobs:
  annotation-and-v5-input-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Check unmarked-photo import scripts
        run: python -m py_compile scripts/import_six_fabric_for_manual_annotation.py scripts/verify_six_fabric_samples.py
      - name: Verify six originals and zooms when uploaded
        shell: bash
        run: |
          if [ -f datasets/user_contributed/2026-10-13-six-fabric-images/image_provenance.json ]; then
            python scripts/verify_six_fabric_samples.py
          else
            echo "Clean images pending user-local Git upload (no false positives)."
          fi
      - name: Check annotation browser syntax
        run: node --check tools/yarn_annotator/app.js
      - name: Test synthetic annotation contracts
        run: python -m unittest discover -s benchmark/tests -v
      - name: Audit saved annotation state (empty is allowed)
        run: python -m benchmark.manual_annotation audit
