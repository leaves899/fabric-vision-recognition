name: verify 8k physical yarn center metric thresholds
on:
  push:
    branches:
      - experiment/shibie-8k-capture-multiwindow
    paths:
      - .github/workflows/shibie-8k-metric-sensitivity.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r shibie/requirements.txt
      - name: Read previously frozen native 8k predictions, without rerunning inference
        run: gh run download 39437637934 --repo "$GITHUB_REPOSITORY" --dir /tmp/native8k-frozen
      - name: Reproduce held-out physical yarn truth and independently audit F1
        run: |
          python -u shibie/audit_center_metric_thresholds.py \
            --artifacts /tmp/native8k-frozen \
            --out experiments/shibie-8k-capture-multiwindow/metric-sensitivity
          cat experiments/shibie-8k-capture-multiwindow/metric-sensitivity/REPORT.md
      - name: Publish exact metrics and validation outcome on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/shibie-8k-capture-multiwindow/metric-sensitivity
          git commit -m "test(shibie): publish independently reproduced F1 threshold audit [skip ci]"
          git fetch origin experiment/shibie-8k-capture-multiwindow
          git rebase origin/experiment/shibie-8k-capture-multiwindow
          git push origin HEAD:experiment/shibie-8k-capture-multiwindow
