name: shibie capture-conditioned R-T sweep
on:
  push:
    branches:
      - experiment/shibie-review-20261020
    paths:
      - .github/workflows/shibie-capture-sweep.yml
      - shibie/run_capture_condition_sweep.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rt-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r shibie/requirements.txt
      - name: Execute capture-conditioned R/T sweep
        run: python shibie/run_capture_condition_sweep.py
      - name: Show report
        if: always()
        shell: bash
        run: |
          if test -f experiments/shibie-capture-conditioned-20261020/report.md; then
            cat experiments/shibie-capture-conditioned-20261020/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve original and candidate centerline images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-capture-param-evidence
          path: experiments/shibie-capture-conditioned-20261020/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit only lightweight numerical result report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/shibie-capture-conditioned-20261020/report.md experiments/shibie-capture-conditioned-20261020/measurements.csv experiments/shibie-capture-conditioned-20261020/measurements.json
          if ! git diff --cached --quiet; then
            git commit -m "test(shibie): record capture-conditioned R/T param and centerline evidence [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin experiment/shibie-review-20261020
              git rebase origin/experiment/shibie-review-20261020 || exit 1
              if git push origin HEAD:experiment/shibie-review-20261020; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
