name: V5.1 G1.2 frozen LightGBM evidence retest
on:
  pull_request:
    paths:
      - '.github/workflows/v51-g12-scoremap.yml'
      - 'demo/v5/v4_scoremap_probe.py'
      - 'demo/v5/v51_g12_refinement.py'
      - 'benchmark/v51_g12_evaluate.py'
      - 'benchmark/tests/test_v51_g12.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-photo-frozen-score-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        sample: [U20261013_01, U20261013_02, U20261013_03, U20261013_05, U20261013_06]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/v5/requirements.txt
      - name: Install frozen V5 dependencies
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Safety contract tests on synthetic data
        run: python -m unittest discover -s benchmark/tests -p 'test_v51_g12.py' -v
      - name: Validate human physical-reference provenance
        run: python -m benchmark.manual_annotation audit
      - name: Re-run unchanged frozen V5
        run: python -m benchmark.run_annotated_v5_roi --id "${{ matrix.sample }}" --margin-px 380 --max-pixels 3000000 --out "experiments/v51-g12/${{ matrix.sample }}/baseline"
      - name: Baseline local-label evaluation
        run: python -m benchmark.v5_pr16_local_evidence_audit --id "${{ matrix.sample }}" --result-dir "experiments/v51-g12/${{ matrix.sample }}/baseline"
      - name: Capture frozen V4 scores read-only and compare G1.2 without operator-label inference
        run: python -m benchmark.v51_g12_evaluate --id "${{ matrix.sample }}" --baseline-dir "experiments/v51-g12/${{ matrix.sample }}/baseline" --out "experiments/v51-g12/${{ matrix.sample }}/g12"
      - name: Upload evidence, candidate JSON and before-after overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v51-g12-${{ matrix.sample }}
          path: experiments/v51-g12/${{ matrix.sample }}/
          if-no-files-found: warn
          retention-days: 30
