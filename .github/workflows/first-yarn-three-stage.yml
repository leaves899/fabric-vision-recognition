name: True physical yarn trajectory 3-stage audit
on:
  pull_request:
    paths:
      - 'benchmark/first_yarn_three_stage.py'
      - 'benchmark/first_yarn_lattice_evidence.py'
      - 'benchmark/tests/test_first_yarn_lattice_evidence.py'
      - 'benchmark/p0_yarn_evidence.py'
      - 'benchmark/tests/test_p0_yarn_evidence.py'
      - 'benchmark/p0_operator_line_audit.py'
      - 'benchmark/tests/test_p0_operator_line_audit.py'
      - 'benchmark/p0_occlusion_continuity.py'
      - 'benchmark/tests/test_p0_occlusion_continuity.py'
      - 'benchmark/p0_cross_fabric_phase.py'
      - 'benchmark/tests/test_p0_cross_fabric_phase.py'
      - 'benchmark/p0_v5_multitransect_audit.py'
      - 'benchmark/tests/test_p0_v5_multitransect_audit.py'
      - 'benchmark/p0_global_yarn_uniqueness.py'
      - 'benchmark/tests/test_p0_global_yarn_uniqueness.py'
      - 'datasets/physical_evidence_labels/**'
      - 'benchmark/direction_only_first_yarn.py'
      - 'benchmark/manual_annotation.py'
      - 'benchmark/tests/test_first_yarn_three_stage.py'
      - 'datasets/annotations/drafts/U20261013_*.json'
      - '.github/workflows/first-yarn-three-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-physical-yarn-3stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/v5/requirements.txt
      - name: Install frozen V5 dependencies plus Pillow for native coordinate audit
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Validate input JPG hashes and real physical-yarn trajectory annotations
        run: python -m benchmark.manual_annotation audit
      - name: Check label semantics, image-only detector, alias/holdout and negative tests
        run: python -m unittest benchmark.tests.test_manual_annotation benchmark.tests.test_user_zoom_annotation benchmark.tests.test_first_yarn_three_stage benchmark.tests.test_first_yarn_lattice_evidence benchmark.tests.test_p0_yarn_evidence benchmark.tests.test_p0_operator_line_audit benchmark.tests.test_p0_occlusion_continuity benchmark.tests.test_p0_cross_fabric_phase benchmark.tests.test_p0_v5_multitransect_audit benchmark.tests.test_p0_global_yarn_uniqueness -v
      - name: Three-stage real-image experiment on five reviewed samples
        run: python -m benchmark.first_yarn_three_stage --out experiments/first-yarn-3stage
      - name: Four-stage first-family 5-photo physical lattice evidence and A3 holdout
        run: python -m benchmark.first_yarn_lattice_evidence --out experiments/first-yarn-lattice
      - name: P0-1 real-photo candidate evidence gallery and unknown-identity audit
        run: python -m benchmark.p0_yarn_evidence --out experiments/p0-yarn-evidence
      - name: P0 E2 original-camera true/false operator stroke morphology audit (two fabrics)
        run: python -m benchmark.p0_operator_line_audit --out experiments/p0-e2-operator-line-audit
      - name: P0 E4 image-only competing occlusion continuations (held-out relations)
        run: python -m benchmark.p0_occlusion_continuity --out experiments/p0-e4-occlusion-continuity
      - name: E5 zero-tune cross-fabric optical B-phase stress test 01 03 06
        run: python -m benchmark.p0_cross_fabric_phase --out experiments/p0-e5-cross-fabric-phase
      - name: E6 V5 cross-transect optical evidence audit, no physical truth claims
        run: python -m benchmark.p0_v5_multitransect_audit --out experiments/p0-e6-v5-inspired-multitransects
      - name: E6.2 globally unique competing trajectory hypotheses and posthoc weak operator audit
        run: python -m benchmark.p0_global_yarn_uniqueness --out experiments/p0-e62-global-uniqueness
      - name: Upload actual JPEG overlays and complete sample reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-yarn-trajectory-3stage-5-photos
          path: |
            experiments/first-yarn-3stage/
            experiments/first-yarn-lattice/
            experiments/p0-yarn-evidence/
            experiments/p0-e2-operator-line-audit/
            experiments/p0-e4-occlusion-continuity/
            experiments/p0-e5-cross-fabric-phase/
            experiments/p0-e6-v5-inspired-multitransects/
            experiments/p0-e62-global-uniqueness/
          if-no-files-found: warn
          retention-days: 30
