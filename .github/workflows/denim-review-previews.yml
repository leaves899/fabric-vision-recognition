name: Generate denim review previews
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_denim_review_previews.py"
      - ".github/workflows/denim-review-previews.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<12"
      - name: Build image previews
        run: python scripts/generate_denim_review_previews.py
      - name: Commit previews
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/public_samples/review_previews/
          if ! git diff --cached --quiet; then
            git commit -m "data: generate denim visual review previews [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
