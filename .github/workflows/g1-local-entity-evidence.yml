name: G1 local entity evidence

on:
  workflow_dispatch:
  push:
    branches:
      - codex/g1-local-entity-evidence
    paths:
      - "benchmark/local_entity_competition.py"
      - "benchmark/tests/test_local_entity_competition.py"
      - "datasets/annotations/drafts/U20261013_*.json"
      - "datasets/user_contributed/2026-10-13-six-fabric-images/**"
      - ".github/workflows/g1-local-entity-evidence.yml"

jobs:
  g1-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install unchanged image dependencies
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Run G1 contracts
        run: python -m unittest benchmark.tests.test_local_entity_competition -v
      - name: Replay original-photo evidence
        run: python -m benchmark.local_entity_competition --out g1-artifacts
      - name: Publish evidence even when verdict is NOT_EVALUATED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-local-entity-evidence
          path: g1-artifacts/
