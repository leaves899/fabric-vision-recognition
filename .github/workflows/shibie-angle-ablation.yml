name: shibie direction ablation
on:
  push:
    branches:
      - experiment/shibie-review-20261020
    paths:
      - .github/workflows/shibie-angle-ablation.yml
      - shibie/run_orientation_ablation.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine requirements
        run: python -m pip install -r shibie/requirements.txt
      - name: Sweep parameters on development data, then independent holdout
        run: python shibie/run_orientation_ablation.py
      - name: Show comparison in Actions summary
        if: always()
        shell: bash
        run: |
          if test -f experiments/shibie-orientation-ablation-20261020/direction_ablation.md; then
            cat experiments/shibie-orientation-ablation-20261020/direction_ablation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload independent analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shibie-orientation-ablation
          path: experiments/shibie-orientation-ablation-20261020/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit measurement report only
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/shibie-orientation-ablation-20261020/direction_ablation.md experiments/shibie-orientation-ablation-20261020/direction_ablation.csv experiments/shibie-orientation-ablation-20261020/direction_ablation.json
          if ! git diff --cached --quiet; then
            git commit -m "test(shibie): record blind direction ablation results [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin experiment/shibie-review-20261020
              git rebase origin/experiment/shibie-review-20261020 || exit 1
              if git push origin HEAD:experiment/shibie-review-20261020; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
