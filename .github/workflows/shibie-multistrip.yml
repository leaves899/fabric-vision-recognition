name: shibie multi-strip independent pitch experiment
on:
  push:
    branches:
      - experiment/shibie-review-20261020
    paths:
      - .github/workflows/shibie-multistrip.yml
      - shibie/experiment_multistrip_pitch.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r shibie/requirements.txt
      - name: Cross-strip intensity and edge-evidence pitch experiment
        run: python shibie/experiment_multistrip_pitch.py
      - name: Show experiment report
        if: always()
        run: |
          if test -f experiments/shibie-multistrip-pitch-20261020/report.md; then
            cat experiments/shibie-multistrip-pitch-20261020/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shibie-multistrip-results
          path: experiments/shibie-multistrip-pitch-20261020/
          if-no-files-found: warn
      - name: Persist results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/shibie-multistrip-pitch-20261020/
          if ! git diff --cached --quiet; then
            git commit -m "experiment(shibie): record multi-strip pitch test [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin experiment/shibie-review-20261020
              git rebase origin/experiment/shibie-review-20261020 || exit 1
              if git push origin HEAD:experiment/shibie-review-20261020; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
