name: V5 new reviewed annotations round 2
on:
  pull_request:
    paths:
      - '.github/workflows/v5-new-reviewed-round2.yml'
      - 'benchmark/**'
      - 'datasets/annotations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u001-reviewed-native-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/v5/requirements.txt
      - name: Install unchanged V5 dependencies
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Check all operator-reviewed/draft/negative state
        run: python -m benchmark.manual_annotation audit
      - name: Run unchanged V5 on newly reviewed U001 native-pixel ROI only
        run: python -m benchmark.run_annotated_v5_roi --id U001 --margin-px 380 --max-pixels 3000000 --out experiments/v5-round2/U001
      - name: Analyze candidate positions relative to independent manual yarn line
        run: python -m benchmark.phase_offset_diagnostic --id U001 --result-dir experiments/v5-round2/U001
      - name: Upload V5 JSON and three-panel plus position evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-round2-U001
          path: experiments/v5-round2/U001/
          if-no-files-found: warn
          retention-days: 30
