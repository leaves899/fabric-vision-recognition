name: First yarn direction-only reinterpretation and candidate audit
on:
  pull_request:
    paths:
      - '.github/workflows/first-yarn-evidence.yml'
      - 'benchmark/first_yarn_evidence.py'
      - 'benchmark/direction_only_first_yarn.py'
      - 'benchmark/tests/test_direction_only_first_yarn.py'
      - 'benchmark/tests/test_first_yarn_evidence.py'
      - 'datasets/annotations/drafts/U20261013_*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-only-fiber-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/v5/requirements.txt
      - name: Dependencies (including actual annotation Pillow requirement)
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Source photo hash, native zoom coordinate and operator audit
        run: python -m benchmark.manual_annotation audit
      - name: Synthetic and semantics guards (no physical GT from direction guides)
        run: python -m unittest benchmark.tests.test_first_yarn_evidence benchmark.tests.test_direction_only_first_yarn -v
      - name: Invalidate historical pixel-localization scores for direction-only annotations
        run: python -m benchmark.first_yarn_evidence --out experiments/first-yarn-invalidated
      - name: Generate image-only first-family candidate previews from inferred axis
        run: python -m benchmark.direction_only_first_yarn --out experiments/first-yarn-direction-only
      - name: Preserve honest reports and five exploratory previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-yarn-direction-only-candidates
          path: |
            experiments/first-yarn-invalidated/
            experiments/first-yarn-direction-only/
          if-no-files-found: warn
          retention-days: 30
