name: V15 FFT-ACF V3 isolated research
on:
  push:
    branches: ['experiment/v15-fft-acf-v3']
  workflow_dispatch:

jobs:
  v3-synthetic-and-project-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal image dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Run V15 v2 and v3 synthetic regressions
        run: python -m unittest discover -s experiments/v15_reflection/tests -v
      - name: Audit 66 project DEV images and reviewed operator axes
        run: python -m experiments.v15_reflection.audit_v3 --out experiments/v15_reflection/output/v3_dev_audit.json
      - name: Upload complete non-certified DEV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-fft-acf-v3-dev-audit
          path: experiments/v15_reflection/output/v3_dev_audit.json
          if-no-files-found: warn
          retention-days: 30
