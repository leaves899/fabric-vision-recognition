name: One-time safe archive and prune old branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-archive-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-archive-cleanup-2026-10-13
  cancel-in-progress: false

jobs:
  archive-old-heads:
    # Push-run executes only for the explicitly named one-time launch commit.
    # workflow_dispatch can be used for manual retry of a failed/partial run.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore: launch safe branch archiving')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile maintenance script (fail before any mutation)
        run: python -m py_compile .github/scripts/archive_branches_2026_10_13.py
      - name: Archive verified SHAs before deleting retired branch refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/archive_branches_2026_10_13.py
      - name: Upload immutable archive and deletion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-archive-audit-2026-10-13
          path: branch_cleanup_result.json
          if-no-files-found: warn
          retention-days: 90
