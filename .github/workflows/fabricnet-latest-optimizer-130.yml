name: FabricNET 130 latest experimental physical center compatibility
on:
  push:
    branches:
      - experiment/fabricnet-latest-130-validation-20261021
    paths:
      - .github/workflows/fabricnet-latest-optimizer-130.yml
      - shibie/validate_fabricnet_latest_optimizer_20261021.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabricnet-physical-center:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r shibie/requirements.txt
          python -m pip install pandas requests
      - name: Actual 130 image direct experimental physical center diagnostics
        run: |
          mkdir -p experiments/fabricnet-latest-optimizer-130
          /usr/bin/time -v -o experiments/fabricnet-latest-optimizer-130/resource_usage.txt \
            python -u shibie/validate_fabricnet_latest_optimizer_20261021.py \
              --out experiments/fabricnet-latest-optimizer-130 \
              --sha "$GITHUB_SHA" \
            2>&1 | tee experiments/fabricnet-latest-optimizer-130/run.log
          test "$(find experiments/fabricnet-latest-optimizer-130/overlays/FLOAT_LOCAL -name 'W*.jpg' | wc -l)" = 130
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabricnet-latest-optimizer-130-candidate-traces
          path: experiments/fabricnet-latest-optimizer-130
          retention-days: 30
          if-no-files-found: warn
