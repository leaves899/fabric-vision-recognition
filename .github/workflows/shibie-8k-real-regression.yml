name: shibie native8k experimental branch real-photo nonregression
on:
  push:
    branches:
      - experiment/shibie-8k-capture-multiwindow
    paths:
      - .github/workflows/shibie-8k-real-regression.yml
      - shibie/run_8k_real_regression.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-real-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r shibie/requirements.txt
      - name: Existing 32 baseline module tests
        run: cd shibie && python -m unittest discover -s tests -q
      - name: Human-labeled smartphone photos, FabricNET and actual uncalibrated R/T
        run: /usr/bin/time -v python -u shibie/run_8k_real_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shibie-8k-branch-real-baseline-regression
          path: experiments/shibie-8k-capture-multiwindow/real-regression/
          if-no-files-found: warn
          retention-days: 14
