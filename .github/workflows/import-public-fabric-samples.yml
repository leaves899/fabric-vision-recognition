name: Import licensed fabric photographs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-public-fabric-samples.yml"
      - "datasets/public_samples/sources.json"
      - "scripts/fetch_public_samples.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-public-fabric-samples
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image verifier
        run: python -m pip install "Pillow>=10,<12"
      - name: Download and verify original images
        run: python scripts/fetch_public_samples.py
      - name: Commit real JPG files with checksums
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/public_samples/images datasets/public_samples/checksums.sha256 datasets/public_samples/sync_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: sync licensed textile photographs [skip ci]"
            # Other research PRs may merge while pictures are downloading.
            # Rebase the image-only commit onto the newest main before pushing.
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Concurrent update; retrying push attempt $attempt"
              sleep 4
            done
            if [ "$pushed" != true ]; then
              echo "Unable to push after 5 attempts"
              exit 1
            fi
          else
            echo "All public sample photographs are already present."
          fi
