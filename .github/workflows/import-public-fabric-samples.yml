name: Import licensed fabric photographs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-public-fabric-samples.yml"
      - "datasets/public_samples/sources.json"
      - "scripts/fetch_public_samples.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-public-fabric-samples
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image verifier
        run: python -m pip install "Pillow>=10,<12"
      - name: Download and verify original images
        run: python scripts/fetch_public_samples.py
      - name: Commit real JPG files with checksums
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/public_samples/images datasets/public_samples/checksums.sha256
          if ! git diff --cached --quiet; then
            git commit -m "data: import 8 licensed textile photographs [skip ci]"
            git push origin HEAD:main
          else
            echo "All public sample photographs are already present."
          fi
