name: shibie optical polarity topology diagnostic
on:
  push:
    branches:
      - experiment/shibie-polarity-topology-20261020
    paths:
      - .github/workflows/shibie-polarity-topology.yml
      - shibie/experiment_polarity_topology.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r shibie/requirements.txt
      - run: python shibie/experiment_polarity_topology.py
      - name: Report evidence
        if: always()
        run: |
          if test -f experiments/shibie-polarity-topology-20261020/report.md; then
            cat experiments/shibie-polarity-topology-20261020/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shibie-polarity-topology-audit
          path: experiments/shibie-polarity-topology-20261020/
          if-no-files-found: warn
      - name: Commit report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/shibie-polarity-topology-20261020/report.md experiments/shibie-polarity-topology-20261020/polarity_scores.json experiments/shibie-polarity-topology-20261020/review_sheet.jpg
          git diff --cached --quiet && exit 0
          git commit -m "test(shibie): record independent yarn/pore topology polarity evidence [skip ci]"
          git fetch origin experiment/shibie-polarity-topology-20261020
          git rebase origin/experiment/shibie-polarity-topology-20261020
          git push origin HEAD:experiment/shibie-polarity-topology-20261020
