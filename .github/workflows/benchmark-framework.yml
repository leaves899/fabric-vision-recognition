name: Step0 benchmark framework
on:
  push:
    branches: [main]
  pull_request:

jobs:
  step0-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered image files and GT contract
        run: python -m benchmark.dataset --check-images
      - name: Preview incremental public sample intake (read-only)
        run: python -m benchmark.public_intake
      - name: Run stdlib benchmark tests (synthetic fixtures only)
        run: python -m unittest discover -s benchmark/tests -v
