name: Blind fabric dataset audit regression
on:
  push:
    branches:
      - research/20261104-batch-count-weave-audit
    paths:
      - research/20261104_dataset_audit/**
      - .github/workflows/fabric-dataset-batch-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum image decode dependencies
        run: python -m pip install "numpy>=1.26,<3" "opencv-python-headless>=4.8,<5"
      - name: Compile the new batch-audit source
        run: python -m py_compile research/20261104_dataset_audit/run_dataset.py research/20261104_dataset_audit/test_run_dataset.py
      - name: Test ZIP manifest, corruption handling, scoring isolation, and paired filenames
        run: python -m unittest discover -s research/20261104_dataset_audit -p 'test_run_dataset.py' -v
