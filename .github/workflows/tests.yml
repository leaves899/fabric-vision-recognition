name: V5 baseline tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  v5-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/v5/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Frozen V4 + V5 unit tests
        run: python -m pytest -q tests
