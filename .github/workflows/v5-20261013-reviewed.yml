name: V5 20261013 latest reviewed annotation evaluation
on:
  pull_request:
    paths:
      - '.github/workflows/v5-20261013-reviewed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-unchanged-reviewed-native-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [U20261013_01, U20261013_02, U20261013_03, U20261013_05, U20261013_06]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: demo/v5/requirements.txt
      - name: Install original V5 requirements
        run: python -m pip install -r demo/v5/requirements.txt Pillow
      - name: Validate latest human labels and image provenance
        run: python -m benchmark.manual_annotation audit
      - name: Execute frozen V5 on native-pixel photo ROI
        run: python -m benchmark.run_annotated_v5_roi --id "${{ matrix.sample }}" --margin-px 380 --max-pixels 3000000 --out "experiments/v5-20261013/${{ matrix.sample }}"
      - name: Evaluate position against independently marked yarn
        run: python -m benchmark.phase_offset_diagnostic --id "${{ matrix.sample }}" --result-dir "experiments/v5-20261013/${{ matrix.sample }}"
      - name: Print machine-readable evaluation
        if: always()
        env:
          SID: ${{ matrix.sample }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("experiments/v5-20261013")/os.environ["SID"]
          report={"sample_id":os.environ["SID"]}
          for name in ("summary.json","phase_diagnostic.json"):
              q=p/name
              if q.exists():
                  report[name.removesuffix(".json")]=json.loads(q.read_text(encoding="utf-8"))
              else:
                  report[name.removesuffix(".json")]={"status":"NOT_GENERATED"}
          print("V5_LATEST_EVALUATION_JSON="+json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload V5 result JSON and visualization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-20261013-${{ matrix.sample }}
          path: experiments/v5-20261013/${{ matrix.sample }}/
          if-no-files-found: warn
          retention-days: 30
