name: shibie baseline replay
on:
  push:
    branches:
      - experiment/shibie-review-20261020
    paths:
      - .github/workflows/shibie-baseline-replay.yml
      - shibie/run_replay_validation.py
  workflow_dispatch:
    inputs:
      scope:
        description: "smoke (19 cases) or full (137 cases)"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine dependencies
        run: python -m pip install -r shibie/requirements.txt
      - name: Test current engine
        run: cd shibie && python -m unittest discover -s tests -q
      - name: Replay previous images with original parameters
        run: python shibie/run_replay_validation.py --scope "${{ inputs.scope || 'full' }}"
      - name: Publish report in run summary
        if: always()
        shell: bash
        run: |
          if test -f experiments/shibie-review-20261020/summary.md; then
            cat experiments/shibie-review-20261020/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shibie-replay-${{ inputs.scope || 'full' }}
          path: experiments/shibie-review-20261020/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit human-readable summary to review branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/shibie-review-20261020/summary.md experiments/shibie-review-20261020/summary.csv experiments/shibie-review-20261020/summary.json
          if ! git diff --cached --quiet; then
            git commit -m "test(shibie): record frozen replay summary [skip ci]"
            git push origin HEAD:experiment/shibie-review-20261020
          fi
